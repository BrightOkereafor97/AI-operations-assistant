name: Backend Docker Build

on:
  push:
    branches:
      - production-web

  pull_request:
    branches:
      - production-web

  workflow_dispatch:


jobs:

  build-and-test-backend:

    name: Build and Smoke Test FastAPI Container

    runs-on: ubuntu-latest


    # ============================================================
    # TEMPORARY POSTGRESQL
    #
    # GitHub creates this only for this workflow run.
    # It disappears when the job finishes.
    # ============================================================

    services:

      postgres:

        image: postgres:16

        env:

          POSTGRES_USER: ai_ops_user

          POSTGRES_PASSWORD: ci_password

          POSTGRES_DB: ai_operations_assistant


        ports:

          - 5432:5432


        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      # ==========================================================
      # 1. DOWNLOAD REPOSITORY
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. SET UP DOCKER
      # ==========================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ==========================================================
      # 3. BUILD IMAGE
      #
      # load: true means the finished image is made available
      # to Docker on the GitHub runner so we can actually run it.
      # ==========================================================

      - name: Build backend Docker image
        uses: docker/build-push-action@v6

        with:

          context: .

          file: ./Dockerfile

          push: false

          load: true

          tags: ai-operations-assistant:ci

          cache-from: type=gha

          cache-to: type=gha,mode=max


      # ==========================================================
      # 4. START FASTAPI CONTAINER
      #
      # The DATABASE_URL points to the temporary PostgreSQL
      # service created above.
      #
      # --network host works because this GitHub runner is Linux.
      # ==========================================================

      - name: Start FastAPI container

        run: |

          docker run -d \
            --name ai-ops-backend \
            --network host \
            -e DATABASE_URL="postgresql+psycopg://ai_ops_user:ci_password@127.0.0.1:5432/ai_operations_assistant" \
            ai-operations-assistant:ci


      # ==========================================================
      # 5. WAIT FOR FASTAPI
      # ==========================================================

      - name: Wait for FastAPI

        run: |

          echo "Waiting for FastAPI..."

          for i in {1..30}; do

            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8000/api/health \
              > health.json
            then

              echo "FastAPI is responding."

              exit 0

            fi


            if ! docker ps \
              --filter name=ai-ops-backend \
              --filter status=running \
              --format '{{.Names}}' \
              | grep -q ai-ops-backend
            then

              echo "Container stopped unexpectedly."

              docker logs ai-ops-backend

              exit 1

            fi


            sleep 2

          done


          echo "FastAPI did not become ready."

          docker logs ai-ops-backend

          exit 1


      # ==========================================================
      # 6. VALIDATE HEALTH RESPONSE
      # ==========================================================

      - name: Validate backend health

        run: |

          echo "Health response:"

          cat health.json


          python - <<'PY'

          import json


          with open(
              "health.json",
              "r",
              encoding="utf-8",
          ) as file:

              health = json.load(
                  file
              )


          assert (
              health["status"]
              ==
              "healthy"
          ), health


          components = (
              health[
                  "components"
              ]
          )


          assert (
              components[
                  "fastapi"
              ][
                  "status"
              ]
              ==
              "ready"
          ), health


          assert (
              components[
                  "postgresql"
              ][
                  "status"
              ]
              ==
              "connected"
          ), health


          assert (
              components[
                  "rag_knowledge"
              ][
                  "status"
              ]
              ==
              "available"
          ), health


          assert (
              components[
                  "agent_tools"
              ][
                  "status"
              ]
              ==
              "available"
          ), health


          print(
              "Container smoke test PASSED."
          )

          PY


      # ==========================================================
      # 7. SHOW LOGS
      #
      # Useful evidence that the container really started.
      # ==========================================================

      - name: Show FastAPI container logs

        if: always()

        run: |

          docker logs ai-ops-backend || true


      # ==========================================================
      # 8. CLEAN UP
      # ==========================================================

      - name: Stop test container

        if: always()

        run: |

          docker rm \
            -f \
            ai-ops-backend \
            || true