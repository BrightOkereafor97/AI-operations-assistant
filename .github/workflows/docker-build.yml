name: Backend Docker Build

on:
  push:
    branches:
      - production-web

  pull_request:
    branches:
      - production-web

  workflow_dispatch:


# ================================================================
# REQUIRED FOR GITHUB → AWS OIDC
# ================================================================

permissions:
  contents: read
  id-token: write


# ================================================================
# SHARED SETTINGS
# ================================================================

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: ai-operations-assistant


jobs:

  build-test-and-push:

    name: Build, Test and Push FastAPI Container

    runs-on: ubuntu-latest


    # ============================================================
    # TEMPORARY POSTGRESQL FOR THE CI TEST
    # ============================================================

    services:

      postgres:

        image: postgres:16

        env:
          POSTGRES_USER: ai_ops_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ai_operations_assistant

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:

      # ==========================================================
      # 1. DOWNLOAD THE REPOSITORY
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # 2. PREPARE DOCKER BUILDX
      # ==========================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ==========================================================
      # 3. BUILD THE BACKEND IMAGE
      # ==========================================================

      - name: Build backend Docker image
        uses: docker/build-push-action@v6

        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true

          tags: ai-operations-assistant:ci

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ==========================================================
      # 4. START THE FASTAPI CONTAINER
      # ==========================================================

      - name: Start FastAPI container

        run: |

          docker run -d \
            --name ai-ops-backend \
            --network host \
            -e DATABASE_URL="postgresql+psycopg://ai_ops_user:ci_password@127.0.0.1:5432/ai_operations_assistant" \
            ai-operations-assistant:ci


      # ==========================================================
      # 5. WAIT UNTIL FASTAPI RESPONDS
      # ==========================================================

      - name: Wait for FastAPI

        run: |

          echo "Waiting for FastAPI..."

          for i in {1..30}; do

            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8000/api/health \
              > health.json
            then

              echo "FastAPI is responding."

              exit 0

            fi


            if ! docker ps \
              --filter name=ai-ops-backend \
              --filter status=running \
              --format '{{.Names}}' \
              | grep -q ai-ops-backend
            then

              echo "Container stopped unexpectedly."

              docker logs ai-ops-backend

              exit 1

            fi


            sleep 2

          done


          echo "FastAPI did not become ready."

          docker logs ai-ops-backend

          exit 1


      # ==========================================================
      # 6. VALIDATE THE BACKEND HEALTH RESPONSE
      # ==========================================================

      - name: Validate backend health

        run: |

          echo "Health response:"

          cat health.json


          python - <<'PY'

          import json


          with open(
              "health.json",
              "r",
              encoding="utf-8",
          ) as file:

              health = json.load(file)


          assert (
              health["status"]
              ==
              "healthy"
          ), health


          components = health["components"]


          assert (
              components["fastapi"]["status"]
              ==
              "ready"
          ), health


          assert (
              components["postgresql"]["status"]
              ==
              "connected"
          ), health


          assert (
              components["rag_knowledge"]["status"]
              ==
              "available"
          ), health


          assert (
              components["agent_tools"]["status"]
              ==
              "available"
          ), health


          print(
              "Container smoke test PASSED."
          )

          PY


      # ==========================================================
      # 7. SHOW FASTAPI LOGS
      # ==========================================================

      - name: Show FastAPI container logs

        if: always()

        run: |

          docker logs ai-ops-backend || true


      # ==========================================================
      # 8. STOP THE TEST CONTAINER
      # ==========================================================

      - name: Stop test container

        if: always()

        run: |

          docker rm -f ai-ops-backend || true


      # ==========================================================
      # 9. GET TEMPORARY AWS CREDENTIALS THROUGH OIDC
      #
      # This runs only for pushes to production-web.
      # ==========================================================

      - name: Configure AWS credentials

        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/production-web'

        uses: aws-actions/configure-aws-credentials@v6.3.0

        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # ==========================================================
      # 10. LOGIN TO AMAZON ECR
      # ==========================================================

      - name: Login to Amazon ECR

        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/production-web'

        id: ecr

        uses: aws-actions/amazon-ecr-login@v2


      # ==========================================================
      # 11. TAG AND PUSH THE IMAGE TO ECR
      # ==========================================================

      - name: Push backend image to Amazon ECR

        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/production-web'

        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}

        run: |

          echo "Tagging Docker image..."


          docker tag \
            ai-operations-assistant:ci \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest


          docker tag \
            ai-operations-assistant:ci \
            $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA


          echo "Pushing latest image..."


          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest


          echo "Pushing commit-specific image..."


          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA


          echo "ECR push completed successfully."